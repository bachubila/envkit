name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly run of the bw backend

permissions:
  contents: read

jobs:
  ready:
    if: github.event_name != 'schedule'
    name: check, test, build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (package.json engines) and current LTS.
        node: ["22.18", "24"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - run: vp run ready
      - name: Smoke-test the built binary
        run: |
          node packages/cli/dist/bin.mjs --version
          node packages/cli/dist/bin.mjs --help

  integration:
    name: integration (native backend, Vaultwarden in Docker)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      - run: vp run test:integration

  integration-bw:
    name: integration (bw backend)
    # About 20 minutes, so not on every pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      ENVKIT_BACKEND: bw
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      - run: vp run test:integration
