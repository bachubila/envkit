packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@bitwarden/cli": 2026.10.0
  "@clack/prompts": 1.8.1
  "@napi-rs/keyring": 2.1.1
  "@types/cross-spawn": ^6.0.6
  "@types/node": ^24
  citty: ^0.2.2
  cross-spawn: ^7.0.6
  dotenv: 18.0.8
  typescript: ^7.0.2
  valibot: 1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitepress: 1.6.4
  vue: ^3.5.0
overrides:
  vite@*: "catalog:"
  # VitePress 1 uses Rollup bundle APIs that Rolldown does not support.
  "vitepress>vite": ^5.4.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  # VitePress uses esbuild to compile its config and render page assets.
  esbuild: true
  # Postinstall only prints a funding banner.
  core-js: false
